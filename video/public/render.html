<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>HiveGPT 视频 · 渲染</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<!-- The MP4 renderer (deploy/videorender) opens this page, calls __setup(), then for every frame seeks the
     player and calls __subtitle(t) before taking a screenshot. Not used by the app itself. -->
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
#root{position:absolute;inset:0;overflow:hidden}
#root iframe{position:absolute;border:0;display:block}
.sub{position:absolute;left:0;right:0;display:flex;justify-content:center;padding:0 6%;box-sizing:border-box}
.sub span{display:inline-block;text-align:center;font-weight:600;line-height:1.35;color:#fff}
.landscape .sub{bottom:3.5%}
.landscape .sub span{background:rgba(0,0,0,.65);border-radius:14px;padding:.18em .6em}
.landscape.tall .sub{bottom:6%}
.portrait .head{position:absolute;left:72px;right:72px;top:150px}
.portrait .series{font-size:40px;font-weight:600;letter-spacing:.04em;opacity:.9}
.portrait .title{margin-top:22px;font-size:80px;font-weight:800;line-height:1.22;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.portrait .sub{top:1340px;padding:0 64px}
.portrait .sub span{font-size:60px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.portrait .brand{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:30px;letter-spacing:.2em;opacity:.55}
</style>
</head>
<body>
<div id="root"></div>
<script src="/render.js"></script>
</body>
</html>
