# =============================================================================
# 无限画布 (infinite-canvas) — 部署在子域名上的 AI 生图工作台
# 上游项目: https://github.com/basketikun/infinite-canvas
# 本站定制分支: https://github.com/DaemonforY/infinite-canvas（默认接口指向主站、顶栏回链主站、去掉 GitHub 链接）
#
# 纯静态前端 (nginx)，浏览器直连 Sub2API 的 /v1 接口，不需要数据库。
# 与主站 compose 独立，互不影响：
#   cd deploy/canvas && sudo docker compose pull && sudo docker compose up -d
#
# 前置条件（详见 README.md）：
#   1. DNS: canvas.<domain> A 记录指向本机
#   2. Caddy: 为 canvas.<domain> 增加 reverse_proxy 127.0.0.1:3000
#   3. Sub2API 主站 .env 设置 CORS_ALLOWED_ORIGINS=https://canvas.<domain>
# =============================================================================
services:
  canvas:
    image: ghcr.io/daemonfory/infinite-canvas:latest
    container_name: infinite-canvas
    restart: unless-stopped
    ports:
      # 只绑定本机回环，由 Caddy 对外提供 HTTPS
      - "127.0.0.1:${CANVAS_PORT:-3000}:3000"
    environment:
      # 主站信息：画布顶栏回链、渠道默认接口地址、注册/购买引导都指向这里。
      # 部署到其他站点时只需改这三项，无需重新构建镜像。
      - MAIN_SITE_URL=${MAIN_SITE_URL:-https://hivegpt.cn}
      - MAIN_SITE_NAME=${MAIN_SITE_NAME:-HiveGPT}
      - MAIN_SITE_API_BASE_URL=${MAIN_SITE_API_BASE_URL:-https://hivegpt.cn}
      # 首次访问的默认皮肤：nebula(星云紫) / ocean / forest / sunset / sakura / classic(原版灰)
      - DEFAULT_SKIN=${CANVAS_DEFAULT_SKIN:-nebula}
      # 可选统计（留空即关闭）
      - ANALYTICS_GA4_ID=${ANALYTICS_GA4_ID:-}
      - ANALYTICS_BAIDU_ID=${ANALYTICS_BAIDU_ID:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
