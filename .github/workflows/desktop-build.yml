name: Desktop App Build

# HiveGPT 桌面助手 (desktop/). Builds the Windows installer (NSIS, per-user) and keeps it as an
# artifact. Not signed yet: Windows SmartScreen shows a warning until a code-signing cert is added.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/desktop-*'
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build installer
        run: pnpm tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: hivegpt-desktop-windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
